name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install validator dependencies
        run: python -m pip install pyyaml==6.0.3
      # Node.js is preinstalled on GitHub-hosted Ubuntu runners and is used for `node --check`.
      - name: Validate skills, references, scripts, evals, and plugin manifests
        run: python tools/validate_skills.py
      # Chrome is preinstalled on GitHub-hosted Ubuntu runners; under CI a missing browser fails the step.
      - name: Prove the tracker overlays mask sensitive fields, in headless Chrome
        run: node tools/test_trackers.mjs
      - name: Prove the trackers record a Playwright test across a reload, masked, in headless Chrome
        run: node tools/test_recording.mjs
      - name: Prove context-keeper's records, resume, secret refusal, and hooks, in throwaway repositories
        run: node tools/test_context.mjs
      - name: Prove the mutation runner kills, restores, and refuses as documented
        run: node tools/test_mutate.mjs
      - name: Prove figma-implementer's measuring and pixel comparison, in headless Chrome
        run: node tools/test_figma_scripts.mjs
